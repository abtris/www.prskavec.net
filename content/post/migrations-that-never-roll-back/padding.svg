<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 720 210" role="img" aria-label="A no-op placeholder fills the missing prefix 014 so that position equals prefix">
  <rect width="718" height="208" x="1" y="1" fill="#fcfcfb" stroke="#e6e5e1" rx="14"/>
  <text x="40" y="36" fill="#0b0b0b" font-size="17" font-weight="700">Pad the gaps until position equals prefix</text>
  <text x="40" y="57" fill="#52514e" font-size="12.5">tern stores a position in the list; operators read the number in the filename</text>
  <g text-anchor="middle">
    <rect x="40" y="78" width="116" height="70" rx="8" fill="#ffffff" stroke="#c9c8c3"/>
    <text x="98" y="110" font-size="20" font-weight="700" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace">012</text>
    <text x="98" y="132" font-size="11.5" fill="#52514e">migration file</text>
    <rect x="171" y="78" width="116" height="70" rx="8" fill="#ffffff" stroke="#c9c8c3"/>
    <text x="229" y="110" font-size="20" font-weight="700" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace">013</text>
    <text x="229" y="132" font-size="11.5" fill="#52514e">migration file</text>
    <rect x="302" y="78" width="116" height="70" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="360" y="110" font-size="20" font-weight="700" fill="#1f5ca6" font-family="ui-monospace, Menlo, Consolas, monospace">014</text>
    <text x="360" y="132" font-size="11.5" fill="#1f5ca6">no-op placeholder</text>
    <rect x="433" y="78" width="116" height="70" rx="8" fill="#ffffff" stroke="#c9c8c3"/>
    <text x="491" y="110" font-size="20" font-weight="700" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace">015</text>
    <text x="491" y="132" font-size="11.5" fill="#52514e">migration file</text>
    <rect x="564" y="78" width="116" height="70" rx="8" fill="#ffffff" stroke="#c9c8c3"/>
    <text x="622" y="110" font-size="20" font-weight="700" fill="#0b0b0b" font-family="ui-monospace, Menlo, Consolas, monospace">016</text>
    <text x="622" y="132" font-size="11.5" fill="#52514e">migration file</text>
  </g>
  <text x="40" y="180" fill="#52514e" font-size="12.5">If the file at position P does not carry prefix P, the run stops instead of migrating from a guess.</text>
</svg>
