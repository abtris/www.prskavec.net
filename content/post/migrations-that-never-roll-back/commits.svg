<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 720 330" role="img" aria-label="golang-migrate commits three times per migration, tern commits once">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#52514e"/></marker>
  </defs>
  <rect width="718" height="328" x="1" y="1" fill="#fcfcfb" stroke="#e6e5e1" rx="14"/>
  <text x="40" y="36" fill="#0b0b0b" font-size="17" font-weight="700">Where the version gets written</text>

  <text x="40" y="70" fill="#52514e" font-size="12.5" font-weight="600">golang-migrate: three commits per migration</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b" text-anchor="middle">
    <rect x="40" y="82" width="190" height="60" rx="8" fill="#fdf1ea" stroke="#eb6834"/>
    <text x="135" y="107">SetVersion(N,</text><text x="135" y="125">dirty = true)</text>
    <rect x="265" y="82" width="190" height="60" rx="8" fill="#ffffff" stroke="#c9c8c3"/>
    <text x="360" y="116">migration SQL</text>
    <rect x="490" y="82" width="190" height="60" rx="8" fill="#fdf1ea" stroke="#eb6834"/>
    <text x="585" y="107">SetVersion(N,</text><text x="585" y="125">dirty = false)</text>
  </g>
  <line x1="232" y1="112" x2="262" y2="112" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="457" y1="112" x2="487" y2="112" stroke="#52514e" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M135,150 L135,160 L585,160 L585,150" fill="none" stroke="#eb6834" stroke-width="1.5"/>
  <text x="360" y="180" fill="#b0461a" font-size="12.5" text-anchor="middle">a crash or failed statement in here leaves N | dirty, and needs a manual force</text>

  <text x="40" y="222" fill="#52514e" font-size="12.5" font-weight="600">tern: one transaction</text>
  <rect x="40" y="234" width="640" height="60" rx="8" fill="#eaf2fc" stroke="#2a78d6"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#0b0b0b" text-anchor="middle">
    <text x="90" y="269">BEGIN</text>
    <text x="215" y="269">migration SQL</text>
    <text x="435" y="269">UPDATE schema_version SET version = N</text>
    <text x="630" y="269">COMMIT</text>
  </g>
  <line x1="130" y1="244" x2="130" y2="284" stroke="#2a78d6" stroke-opacity=".4"/>
  <line x1="290" y1="244" x2="290" y2="284" stroke="#2a78d6" stroke-opacity=".4"/>
  <line x1="585" y1="244" x2="585" y2="284" stroke="#2a78d6" stroke-opacity=".4"/>
  <text x="360" y="314" fill="#1f5ca6" font-size="12.5" text-anchor="middle">a failure rolls back both; the version is unchanged and a rerun is clean</text>
</svg>
